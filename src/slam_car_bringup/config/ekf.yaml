ekf_filter_node:
  ros__parameters:
    frequency: 10.0
    sensor_timeout: 0.1
    two_d_mode: true

    publish_tf: true
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: basefoot_link
    world_frame: odom

    # 里程计输入: /odom_corrected (slip_detector 处理后)
    # yaw/vyaw 由 IMU 独揽，转弯打滑时不再污染 EKF
    odom0: /odom_corrected
    odom0_config:
      [true,  true,  false,   # x, y, z
       false, false, false,   # roll, pitch, yaw — 关，打滑不可靠
       true,  false, false,   # vx, vy, vz
       false, false, false,   # vroll, vpitch, vyaw — 关
       false, false, false]   # ax, ay, az

    # IMU 输入: /imu/data (Madgwick 滤波后)
    imu0: /imu/data
    imu0_config:
      [false, false, false,
       false, false, true,
       false, false, false,
       false, false, true,
       false, false, false]
    imu0_remove_gravitational_acceleration: true
